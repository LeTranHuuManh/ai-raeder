name: ai_reader
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  google_sign_in: ^6.2.1
  
  # State Management
  provider: ^6.1.2
  
  # UI & Utilities
  cached_network_image: ^3.3.1
  file_picker: ^8.0.0
  flutter_tts: ^4.0.2
  syncfusion_flutter_pdf: ^28.2.12
  audioplayers: ^6.0.0
  pdfx: ^2.6.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_rating_bar: ^4.0.1
  flutter_dotenv: ^6.0.0
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/icons/
    - assets/data/
    - assets/fonts/
